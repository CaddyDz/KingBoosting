# Weekly, grouped updates: one pull request per ecosystem for minor and patch versions, majors on their own.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    assignees: [CaddyDz]
    labels: [dependencies, php]
    versioning-strategy: increase
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    assignees: [CaddyDz]
    labels: [dependencies, javascript]
    versioning-strategy: increase
    ignore:
      # Must match the mcr.microsoft.com/playwright image in compose.yaml; update both together
      - dependency-name: "@playwright/test"
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    assignees: [CaddyDz]
    labels: [dependencies, github-actions]
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    assignees: [CaddyDz]
    labels: [dependencies, docker]
