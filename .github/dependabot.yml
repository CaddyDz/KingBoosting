version: 2
registries:
  composer-repository-nova-laravel-com:
    type: composer-repository
    url: https://nova.laravel.com
    username: ${{ secrets.NOVA_USERNAME }}
    password: ${{ secrets.NOVA_API_TOKEN }}
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 99
  registries:
  - composer-repository-nova-laravel-com
  reviewers:
  - CaddyDz
  assignees:
  - CaddyDz
  labels:
  - dependencies
  - php
  versioning-strategy: increase
  allow:
  - dependency-type: direct
  - dependency-type: indirect
  # One pull request for all minor and patch updates; majors still get their own.
  # Separate PRs all rewrite composer.lock, so each merge conflicts the rest.
  groups:
    composer:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 99
  reviewers:
  - CaddyDz
  assignees:
  - CaddyDz
  labels:
  - dependencies
  - javascript
  versioning-strategy: increase
  allow:
  - dependency-type: direct
  - dependency-type: indirect
