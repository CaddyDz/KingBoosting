# Local development stack.
#
#   docker compose up -d --build --wait
#   docker compose exec app php artisan migrate --seed
#
# Everything is served from one origin, http://localhost:8000 (see docs/adr/0001):
# the proxy sends /api, /sanctum, /broadcasting, /stripe and /up to Laravel, /app
# (the WebSocket) to Reverb, and the rest to Nuxt. Mailpit is on http://localhost:8025.
#
# Compose reads the project .env for ${...} substitution, so only port/tooling
# variables are substituted here. Ports are published on 127.0.0.1 only.

name: kingboosting

x-backend-env: &backend-env
  # Real environment variables win over backend/.env in Laravel, so these replace the
  # host-specific values in your .env without editing it.
  APP_ENV: local
  APP_URL: http://localhost:${APP_PORT:-8000}
  FRONTEND_URL: http://localhost:${APP_PORT:-8000}
  SANCTUM_STATEFUL_DOMAINS: localhost:${APP_PORT:-8000}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: kingboosting
  DB_USERNAME: kingboosting
  DB_PASSWORD: secret
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: kingboosting
  # Development-only Reverb credentials
  REVERB_APP_KEY: kingboosting-dev-key
  REVERB_APP_SECRET: kingboosting-dev-secret
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: localhost:${APP_PORT:-8000}
  QUEUE_CONNECTION: database
  XDEBUG_MODE: ${XDEBUG_MODE:-off}

x-backend: &backend
  build:
    context: ./backend
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: kingboosting-app:dev
  environment: *backend-env
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./backend:/var/www/html
    # The tests read docs/pricing-golden.json; this keeps docs/ next to the app, as in the repository
    - ./docs:/var/www/docs:ro
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *backend
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 3
      # A fresh clone runs composer install before php-fpm starts.
      start_period: 10m
      start_interval: 2s

  # Laravel's nginx: serves backend/public and passes PHP requests to `app`.
  web:
    image: nginx:1.30-alpine
    environment:
      NGINX_PORT: "8080"
      NGINX_RESOLVER: 127.0.0.11
      # Long enough to sit on an Xdebug breakpoint.
      NGINX_FASTCGI_READ_TIMEOUT: 3600s
      PHP_FPM_HOST: app
      PHP_FPM_PORT: "9000"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/templates:/etc/nginx/templates:ro
    depends_on:
      app:
        condition: service_healthy

  # Stands in for Traefik: one origin, routed by path.
  proxy:
    image: nginx:1.30-alpine
    environment:
      NGINX_RESOLVER: 127.0.0.11
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:80
    volumes:
      - ./docker/proxy/templates:/etc/nginx/templates:ro
    depends_on:
      web:
        condition: service_started

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kingboosting
      MYSQL_USER: kingboosting
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 127.0.0.1:${FORWARD_DB_PORT:-3306}:3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - 127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025

  # Forwards Stripe test-mode webhooks to Laravel. Needs STRIPE_SECRET in your shell or
  # the project .env:  STRIPE_SECRET=sk_test_... docker compose --profile stripe up -d stripe
  # Put the whsec_... secret it prints into backend/.env as STRIPE_WEBHOOK_SECRET.
  stripe:
    image: stripe/stripe-cli:v1.54.0
    profiles: [stripe]
    command: listen --api-key ${STRIPE_SECRET:-} --forward-to http://web:8080/stripe/webhook
    depends_on:
      web:
        condition: service_started

volumes:
  db_data:
