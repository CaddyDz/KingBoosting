# Production-style stack built from the production image targets: a reference for
# running on a single Docker host.
#
#   cp .env.production.example .env.production   # fill it in
#   export COMPOSE_FILE=compose.prod.yaml COMPOSE_ENV_FILES=.env.production
#   docker compose up -d --build --wait
#   docker compose exec app php artisan db:seed --force   # once, on a new database
#
# db:seed creates the roles and permissions the app needs plus an admin account
# (see database/seeders/BaseSeeder.php); change that password right away.
# Building needs your Nova credentials in auth.json (see README).
#
# `web` (API + Nova) and `frontend` (storefront) are published on 127.0.0.1 only.
# Put a TLS-terminating proxy on this host in front of them that routes by hostname,
# passes the original Host header (nginx: proxy_set_header Host $host; Apache:
# ProxyPreserveHost On; Caddy and Traefik do it by default) and sets
# X-Forwarded-For/Proto. Outside APP_ENV=local the app generates https:// URLs.

name: kingboosting-prod

x-app: &app
  image: kingboosting-app:latest
  env_file: .env.production
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  depends_on:
    db:
      condition: service_healthy

# Wiring that must not depend on what's in .env.production.
x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
  DB_HOST: db
  DB_PORT: "3306"
  DB_SOCKET: ""
  LOG_CHANNEL: stderr

services:
  app:
    <<: *app
    build:
      context: .
      target: app
      secrets:
        - composer_auth
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    # PID 1 ignores stop signals unless an init process forwards them.
    init: true
    stop_signal: SIGTERM
    environment:
      <<: *app-env
      # Leave cache building (including views in the shared storage volume) to app.
      LARAVEL_OPTIMIZE: "false"
    healthcheck:
      disable: true
    # Start after app, which creates the storage volume and runs the migrations.
    depends_on:
      app:
        condition: service_healthy

  web:
    image: kingboosting-web:latest
    build:
      context: .
      target: web
      secrets:
        - composer_auth
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:8080
    volumes:
      - storage:/var/www/html/storage:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: kingboosting-frontend:latest
    build:
      context: ./frontend
      args:
        HOST_URL: ${APP_URL:?Set APP_URL in .env.production}
        STRIPE_KEY: ${STRIPE_KEY:?Set STRIPE_KEY (the publishable key) in .env.production}
        SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
    environment:
      HOST_URL: ${APP_URL}
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-3301}:3301
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME (not root) in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      # The app never needs root; the generated password is printed once in the db logs.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

secrets:
  composer_auth:
    file: ./auth.json

volumes:
  db_data:
  storage:
