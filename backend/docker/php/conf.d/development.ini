; Development overrides on top of php.ini-development.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M

opcache.enable = 1
; Pick up code changes immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug is installed but off: set XDEBUG_MODE=debug (or coverage) to turn it on.
xdebug.mode = "off"
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
