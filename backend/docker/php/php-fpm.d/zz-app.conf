; php-fpm pool settings, loaded after the image's www.conf and docker.conf.

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Probed by the container healthcheck over FastCGI; nginx never routes it.
ping.path = /fpm-ping
ping.response = pong

; nginx already logs every request.
access.log = /dev/null
